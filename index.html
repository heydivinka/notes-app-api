<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval';">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://notes-api.dicoding.dev;">
    <title>Notes App</title>
</head>
<body>
    <app-bar></app-bar>
    
    <main>
        <!-- Form Tambah Catatan -->
        <section class="note-form">
            <h2>Tambah Catatan</h2>
            <note-form></note-form>
        </section>
        
        <!-- Daftar Catatan -->
        <section class="note-list">
            <h2>Daftar Catatan</h2>
            <!-- ✅ Indikator loading yang benar -->
            <p id="loading" style="display: none;">Memuat catatan...</p> 
            <div id="notes-container"></div>
        </section>
    </main>

    <!-- ✅ Pastikan hanya `bundle.js` yang dipanggil -->
    <script src="script.js"></script>
</body>
</html>
